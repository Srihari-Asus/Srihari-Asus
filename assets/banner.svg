<svg fill="none" viewBox="0 0 900 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#121318" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>

    <!-- Accent Red Gradient -->
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3333" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>

    <!-- Glowing Red Radial -->
    <radialGradient id="red-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FF3333" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#FF1E27" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="red-glow-left" cx="10%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="tech-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#22252e" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="0" cy="0" r="1" fill="#FF3333" fill-opacity="0.4" />
    </pattern>

    <!-- Filter for Red Glow -->
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 4px;
      fill: #FFFFFF;
    }
    .role-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', monospace;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
      fill: #FF4D4D;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 1px;
      fill: #9CA3AF;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #FFFFFF;
    }
  </style>

  <!-- Base Background -->
  <rect width="900" height="240" rx="14" fill="url(#bg-grad)" />

  <!-- Grid Layer -->
  <rect width="900" height="240" rx="14" fill="url(#tech-grid)" opacity="0.85" />

  <!-- Ambient Glows -->
  <rect width="900" height="240" rx="14" fill="url(#red-glow)" />
  <rect width="900" height="240" rx="14" fill="url(#red-glow-left)" />

  <!-- Geometric Accent Lines & Frame -->
  <rect x="1.5" y="1.5" width="897" height="237" rx="13" fill="none" stroke="#262B35" stroke-width="1.5" />
  
  <!-- Sleek Top Accent Bar -->
  <line x1="50" y1="2" x2="350" y2="2" stroke="url(#red-grad)" stroke-width="3" stroke-linecap="round" />
  <line x1="720" y1="238" x2="850" y2="238" stroke="url(#red-grad)" stroke-width="3" stroke-linecap="round" />

  <!-- Left Tech Accent Element -->
  <rect x="52" y="55" width="4" height="130" rx="2" fill="url(#red-grad)" filter="url(#glow-effect)" />
  <rect x="52" y="55" width="4" height="130" rx="2" fill="#FF3333" />

  <!-- Modern Pill Tag: SDE Aspirant -->
  <g transform="translate(74, 52)">
    <rect width="270" height="26" rx="13" fill="#180A0D" stroke="#68151D" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4.5" fill="#FF3333" />
    <text x="26" y="17" class="badge-label">SOFTWARE DEVELOPMENT ENGINEER</text>
  </g>

  <!-- Main Name Header -->
  <text x="72" y="126" class="name-title">SRIHARI S<tspan fill="#FF3333">.</tspan></text>

  <!-- Tagline / Status -->
  <text x="74" y="156" class="role-text">FULL STACK DEVELOPER INTERN @ KNITE INFOTECH</text>
  <text x="74" y="180" class="sub-text">B.E. Computer Science &amp; Engineering • Sri Krishna College of Technology (2024–2028)</text>

  <!-- Modern Decorative Graphic in Bottom Right -->
  <g transform="translate(680, 50)" opacity="0.85">
    <!-- Concentric Target Circles -->
    <circle cx="120" cy="70" r="60" stroke="#262C38" stroke-width="1.2" stroke-dasharray="4 4" fill="none" />
    <circle cx="120" cy="70" r="42" stroke="#4B1218" stroke-width="1.2" fill="none" />
    <circle cx="120" cy="70" r="24" stroke="#FF3333" stroke-width="1.8" fill="none" />
    <circle cx="120" cy="70" r="6" fill="#FF3333" />
    
    <!-- Crosshairs -->
    <line x1="45" y1="70" x2="195" y2="70" stroke="#FF3333" stroke-width="0.8" stroke-opacity="0.35" />
    <line x1="120" y1="-5" x2="120" y2="145" stroke="#FF3333" stroke-width="0.8" stroke-opacity="0.35" />

    <!-- Corner Brackets -->
    <path d="M 60 20 L 50 20 L 50 30" fill="none" stroke="#FF3333" stroke-width="2" />
    <path d="M 180 20 L 190 20 L 190 30" fill="none" stroke="#FF3333" stroke-width="2" />
    <path d="M 50 110 L 50 120 L 60 120" fill="none" stroke="#FF3333" stroke-width="2" />
    <path d="M 190 110 L 190 120 L 180 120" fill="none" stroke="#FF3333" stroke-width="2" />
  </g>
</svg>

