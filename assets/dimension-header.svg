<svg fill="none" viewBox="0 0 950 280" width="100%" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11101D" />
      <stop offset="60%" stop-color="#171426" />
      <stop offset="100%" stop-color="#211C35" />
    </linearGradient>

    <!-- Dimensional Electric Violet to Digital Blue Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7657E8" />
      <stop offset="60%" stop-color="#5E7BF5" />
      <stop offset="100%" stop-color="#4D9BFF" />
    </linearGradient>

    <!-- Isometric Face Gradients -->
    <linearGradient id="cube-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7657E8" />
      <stop offset="100%" stop-color="#9A7FFF" />
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D1830" />
      <stop offset="100%" stop-color="#2A2345" />
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D9BFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#211C35" />
    </linearGradient>

    <!-- Subtle Ambient Radial Glow -->
    <radialGradient id="violet-glow" cx="80%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#7657E8" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#4D9BFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#11101D" stop-opacity="0" />
    </radialGradient>

    <!-- Isometric Coordinate Grid -->
    <pattern id="iso-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#7657E8" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="0.8" fill="#4D9BFF" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .meta-tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', monospace;
      font-weight: 700;
      font-size: 10.5px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      fill: #D9CCFF;
    }
    .main-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 3px;
      fill: #F4F0FF;
    }
    .main-statement {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace;
      font-weight: 700;
      font-size: 14.5px;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      fill: #7657E8;
    }
    .sub-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.5px;
      fill: #D9CCFF;
    }
    .intro-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 400;
      font-size: 12.5px;
      letter-spacing: 0.4px;
      fill: #A9A2BC;
    }
  </style>

  <!-- Deep Base -->
  <rect width="950" height="280" rx="14" fill="url(#bg-grad)" />

  <!-- Isometric Coordinate Grid -->
  <rect width="950" height="280" rx="14" fill="url(#iso-grid)" />

  <!-- Ambient Dimensional Lighting -->
  <rect width="950" height="280" rx="14" fill="url(#violet-glow)" />

  <!-- Outer Architectural Border -->
  <rect x="1.5" y="1.5" width="947" height="277" rx="13" fill="none" stroke="#211C35" stroke-width="1.2" />

  <!-- Accent Top Line -->
  <line x1="60" y1="2" x2="380" y2="2" stroke="url(#accent-grad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="720" y1="278" x2="880" y2="278" stroke="url(#accent-grad)" stroke-width="2" stroke-linecap="round" />

  <!-- Left Dimensional Anchor Accent -->
  <rect x="52" y="55" width="3" height="170" rx="1.5" fill="url(#accent-grad)" />

  <!-- Top Metadata Pill -->
  <g transform="translate(74, 52)">
    <rect width="250" height="24" rx="12" fill="#1A162B" stroke="#7657E8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="12" cy="12" r="3.5" fill="#4D9BFF" />
    <text x="24" y="16" class="meta-tag">2024–2028</text>
  </g>

  <!-- Main Name Header -->
  <text x="72" y="122" class="main-name">SRIHARI S<tspan fill="#4D9BFF">.</tspan></text>

  <!-- Statement -->
  <text x="74" y="152" class="main-statement">ENGINEERING THE DIGITAL FUTURE.</text>

  <!-- Professional Subtitle -->
  <text x="74" y="178" class="sub-title">Computer Science Student | Aspiring Software Developer</text>

  <!-- Supporting Introduction -->
  <text x="74" y="202" class="intro-text">Exploring software engineering, full-stack development, problem solving and intelligent technology.</text>

  <!-- Abstract 3D-Inspired Dimensional Geometry (Right Side) -->
  <g transform="translate(735, 60)">
    <!-- Dimensional Plane Coordinate Axes -->
    <line x1="90" y1="90" x2="90" y2="0" stroke="#7657E8" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="3 3" />
    <line x1="90" y1="90" x2="175" y2="135" stroke="#7657E8" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="3 3" />
    <line x1="90" y1="90" x2="5" y2="135" stroke="#7657E8" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="3 3" />

    <!-- Isometric Dimensional Prism / Cube -->
    <!-- Top Face -->
    <polygon points="90,35 150,68 90,100 30,68" fill="url(#cube-top)" stroke="#D9CCFF" stroke-width="1.2" />
    <!-- Left Face -->
    <polygon points="30,68 90,100 90,170 30,138" fill="url(#cube-left)" stroke="#4D9BFF" stroke-width="1" stroke-opacity="0.8" />
    <!-- Right Face -->
    <polygon points="90,100 150,68 150,138 90,170" fill="url(#cube-right)" stroke="#7657E8" stroke-width="1" stroke-opacity="0.8" />

    <!-- Outer Dimensional Wireframe Frame -->
    <polygon points="90,15 170,58 170,148 90,192 10,148 10,58" fill="none" stroke="#7657E8" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4" />

    <!-- Geometric Nodes -->
    <circle cx="90" cy="15" r="3" fill="#4D9BFF" />
    <circle cx="170" cy="58" r="3" fill="#7657E8" />
    <circle cx="170" cy="148" r="3" fill="#D9CCFF" />
    <circle cx="90" cy="192" r="3" fill="#4D9BFF" />
    <circle cx="10" cy="148" r="3" fill="#7657E8" />
    <circle cx="10" cy="58" r="3" fill="#D9CCFF" />

    <!-- Inner Core Nexus Point -->
    <circle cx="90" cy="100" r="3.5" fill="#F4F0FF" />
  </g>
</svg>

