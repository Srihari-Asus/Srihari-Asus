<svg fill="none" viewBox="0 0 950 250" width="100%" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Oceanic Background Gradient -->
    <linearGradient id="ocean-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D1A" />
      <stop offset="45%" stop-color="#071B35" />
      <stop offset="100%" stop-color="#0A2540" />
    </linearGradient>

    <!-- Cyan to Turquoise Accent Gradient -->
    <linearGradient id="cyan-turquoise" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087EAB" />
      <stop offset="50%" stop-color="#00B8D9" />
      <stop offset="100%" stop-color="#20D6C7" />
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087EAB" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#00B8D9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#20D6C7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20D6C7" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#00B8D9" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#087EAB" stop-opacity="0.1" />
    </linearGradient>

    <!-- Bioluminescent Radial Glow -->
    <radialGradient id="cyan-glow-right" cx="82%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00B8D9" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#087EAB" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#040D1A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="turquoise-glow-left" cx="12%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#20D6C7" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#071B35" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#040D1A" stop-opacity="0" />
    </radialGradient>

    <!-- Digital Oceanic Grid -->
    <pattern id="ocean-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#087EAB" stroke-width="0.6" stroke-opacity="0.22" />
      <circle cx="0" cy="0" r="1.2" fill="#00B8D9" fill-opacity="0.35" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: 3px;
      fill: #E8F7FC;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #20D6C7;
    }
    .role-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      fill: #00B8D9;
    }
    .sub-meta {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 400;
      font-size: 13.5px;
      letter-spacing: 0.8px;
      fill: #B0D6E8;
    }
  </style>

  <!-- Deep Ocean Base -->
  <rect width="950" height="250" rx="14" fill="url(#ocean-bg)" />

  <!-- Oceanic Grid Pattern -->
  <rect width="950" height="250" rx="14" fill="url(#ocean-grid)" />

  <!-- Bioluminescent Ambient Lighting -->
  <rect width="950" height="250" rx="14" fill="url(#cyan-glow-right)" />
  <rect width="950" height="250" rx="14" fill="url(#turquoise-glow-left)" />

  <!-- Subtle Digital Ocean Waves -->
  <path d="M 0 160 C 200 130, 420 200, 650 150 C 780 120, 880 145, 950 135 L 950 250 L 0 250 Z" fill="url(#wave-grad-1)" />
  <path d="M 0 185 C 220 155, 460 215, 680 170 C 800 145, 890 175, 950 165 L 950 250 L 0 250 Z" fill="url(#wave-grad-2)" />
  
  <!-- Wave Accent Lines -->
  <path d="M 0 160 C 200 130, 420 200, 650 150 C 780 120, 880 145, 950 135" fill="none" stroke="#00B8D9" stroke-width="1.2" stroke-opacity="0.45" />
  <path d="M 0 185 C 220 155, 460 215, 680 170 C 800 145, 890 175, 950 165" fill="none" stroke="#20D6C7" stroke-width="1" stroke-opacity="0.35" />

  <!-- Outer Frame -->
  <rect x="1.5" y="1.5" width="947" height="247" rx="13" fill="none" stroke="#087EAB" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Top Accent Light Bar -->
  <line x1="60" y1="2" x2="380" y2="2" stroke="url(#cyan-turquoise)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="740" y1="248" x2="880" y2="248" stroke="url(#cyan-turquoise)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Cyber Node Bar -->
  <rect x="52" y="58" width="3.5" height="135" rx="2" fill="url(#cyan-turquoise)" filter="url(#soft-glow)" />
  <rect x="52" y="58" width="3.5" height="135" rx="2" fill="#00B8D9" />

  <!-- Pill Badge: Aspiring SDE -->
  <g transform="translate(74, 54)">
    <rect width="280" height="26" rx="13" fill="#071B35" stroke="#00B8D9" stroke-width="1" stroke-opacity="0.75" />
    <circle cx="14" cy="13" r="4.5" fill="#20D6C7" />
    <circle cx="14" cy="13" r="7.5" stroke="#20D6C7" stroke-width="0.8" stroke-opacity="0.4" fill="none" />
    <text x="28" y="17" class="badge-text">ASPIRING SOFTWARE DEVELOPER</text>
  </g>

  <!-- Developer Name -->
  <text x="72" y="130" class="name-title">SRIHARI S<tspan fill="#20D6C7">.</tspan></text>

  <!-- Subtitle and Meta -->
  <text x="74" y="162" class="role-title">OCEANIC TECH • FULL-STACK &amp; AI-ASSISTED SYSTEMS</text>
  <text x="74" y="186" class="sub-meta">B.E. Computer Science and Engineering • Sri Krishna College of Technology (2024–2028)</text>

  <!-- Futuristic Oceanic Tech Emblem (Right Side) -->
  <g transform="translate(720, 52)" opacity="0.9">
    <!-- Depth Ring Sensors -->
    <circle cx="110" cy="72" r="62" stroke="#087EAB" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="4 4" fill="none" />
    <circle cx="110" cy="72" r="44" stroke="#00B8D9" stroke-width="1.2" stroke-opacity="0.6" fill="none" />
    <circle cx="110" cy="72" r="26" stroke="#20D6C7" stroke-width="1.6" fill="none" />
    <circle cx="110" cy="72" r="6" fill="#20D6C7" />

    <!-- Sonar / Digital Crosshairs -->
    <line x1="38" y1="72" x2="182" y2="72" stroke="#00B8D9" stroke-width="0.9" stroke-opacity="0.4" />
    <line x1="110" y1="0" x2="110" y2="144" stroke="#00B8D9" stroke-width="0.9" stroke-opacity="0.4" />

    <!-- Corner Technical Brackets -->
    <path d="M 54 22 L 44 22 L 44 32" fill="none" stroke="#20D6C7" stroke-width="1.8" />
    <path d="M 166 22 L 176 22 L 176 32" fill="none" stroke="#20D6C7" stroke-width="1.8" />
    <path d="M 44 112 L 44 122 L 54 122" fill="none" stroke="#20D6C7" stroke-width="1.8" />
    <path d="M 176 112 L 176 122 L 166 122" fill="none" stroke="#20D6C7" stroke-width="1.8" />
  </g>
</svg>

