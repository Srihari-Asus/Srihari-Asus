<svg fill="none" viewBox="0 0 850 110" width="100%" height="110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="quote-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D1A" />
      <stop offset="50%" stop-color="#071B35" />
      <stop offset="100%" stop-color="#0A2540" />
    </linearGradient>

    <!-- Cyan Turquoise Border Gradient -->
    <linearGradient id="quote-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087EAB" />
      <stop offset="50%" stop-color="#00B8D9" />
      <stop offset="100%" stop-color="#20D6C7" />
    </linearGradient>

    <radialGradient id="quote-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00B8D9" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#040D1A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .quote-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 500;
      font-style: italic;
      font-size: 15px;
      letter-spacing: 0.5px;
      fill: #E8F7FC;
      text-anchor: middle;
    }
    .quote-author {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #20D6C7;
      text-anchor: middle;
    }
    .quote-mark {
      font-family: Georgia, serif;
      font-size: 38px;
      fill: #00B8D9;
      opacity: 0.35;
    }
  </style>

  <!-- Card Background -->
  <rect width="850" height="110" rx="12" fill="url(#quote-card-bg)" />
  <rect width="850" height="110" rx="12" fill="url(#quote-glow)" />
  <rect x="1" y="1" width="848" height="108" rx="11" fill="none" stroke="url(#quote-border)" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Quote Marks -->
  <text x="50" y="48" class="quote-mark">“</text>
  <text x="800" y="85" class="quote-mark">”</text>

  <!-- Quote Content -->
  <text x="425" y="46" class="quote-text">Navigating deep complex algorithms, engineering scalable architectures,</text>
  <text x="425" y="70" class="quote-text">and bringing intelligent, high-impact systems to the surface.</text>
  <text x="425" y="94" class="quote-author">— Srihari S</text>
</svg>

